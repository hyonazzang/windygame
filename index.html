/* 긴장감 연출 */
.barrow{display:flex;align-items:center;gap:12px;margin-top:10px}.barrow .bar{flex:1;margin-top:0}.secs{font-weight:900;font-size:26px;min-width:66px;text-align:right;font-variant-numeric:tabular-nums}

.intro.stormy::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:lightning 1.4s .25s 2}

.key:active{transform:translateY(3px);box-shadow:0 1px 0 #bad1dc}.key.fn{background:#eaf4f8;font-size:18px;max-width:130px;flex:1.5}.key.on{background:#ffd45b;border-color:#e0b53c}

.rk{max-width:720px;margin:0 auto;text-align:center}.rk h2{font-size:40px;margin:4px 0 12px}

var memRecs=[];
function loadRecs(){try{var r=JSON.parse(localStorage.getItem(STORE_KEY)||"[]");return Array.isArray(r)?r:[]}catch(e){return memRecs}}
function saveRecs(r){memRecs=r;try{localStorage.setItem(STORE_KEY,JSON.stringify(r))}catch(e){}}
/* 순위 = 이름별로 "한 판에서 얻은 가장 높은 점수" (합산하지 않음) */
function board(){var by=Object.create(null);
 loadRecs().forEach(function(r){var b=by[r.n];if(!b)by[r.n]={n:r.n,best:r.s,t:r.t};else if(r.s>b.best){b.best=r.s;b.t=r.t}});
 var arr=Object.keys(by).map(function(k){return by[k]});
 arr.sort(function(x,y){return y.best-x.best||x.t-y.t});return arr}
function record(name,score,m){var recs=loadRecs(),prev=null;
 recs.forEach(function(r){if(r.n===name&&(prev===null||r.s>prev))prev=r.s});
 recs.push({n:name,s:score,m:m,t:Date.now()});saveRecs(recs);
 return{prev:prev,isBest:prev===null||score>prev}}
function rankOf(name){var bd=board();for(var i=0;i<bd.length;i++)if(bd[i].n===name)return{rank:i+1,best:bd[i].best};return{rank:0,best:0}}

var CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ".split(""),JUNG="ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ".split(""),

var VCOMB={"ㅗㅏ":"ㅘ","ㅗㅐ":"ㅙ","ㅗㅣ":"ㅚ","ㅜㅓ":"ㅝ","ㅜㅔ":"ㅞ","ㅜㅣ":"ㅟ","ㅡㅣ":"ㅢ"};

function inv(m){var o={};for(var k in m)o[m[k]]=k;return o}
var VSPLIT=inv(VCOMB),JSPLIT=inv(JCOMB);
function isVowel(j){return JUNG.indexOf(j)>=0}
function newComp(){return{text:"",c:"",v:"",f:""}}
function copyComp(s){return{text:s.text,c:s.c,v:s.v,f:s.f}}
function syl(s){if(s.c&&s.v){var ci=CHO.indexOf(s.c),vi=JUNG.indexOf(s.v),fi=JONG.indexOf(s.f);if(ci>=0&&vi>=0&&fi>=0)return String.fromCharCode(0xAC00+(ci*21+vi)*28+fi)}return(s.c||"")+(s.v||"")+(s.f||"")}
function commit(s){s.text+=syl(s);s.c=s.v=s.f=""}
function value(s){return s.text+syl(s)}
function typeJamo(s,j){
 if(isVowel(j)){
  if(!s.c&&!s.v){s.text+=j;return}
  if(s.c&&!s.v){s.v=j;return}
  if(s.c&&s.v&&!s.f){var cv=VCOMB[s.v+j];if(cv){s.v=cv;return}commit(s);s.text+=j;return}
  if(s.f){var sp=JSPLIT[s.f],mv;if(sp){s.f=sp.charAt(0);mv=sp.charAt(1)}else{mv=s.f;s.f=""}commit(s);s.c=mv;s.v=j;return}
 }else{
  if(!s.c&&!s.v){s.c=j;return}
  if(s.c&&!s.v){commit(s);s.c=j;return}
  if(s.c&&s.v&&!s.f){if(JONG.indexOf(j)>0){s.f=j}else{commit(s);s.c=j}return}
  if(s.f){var cj=JCOMB[s.f+j];if(cj){s.f=cj;return}commit(s);s.c=j;return}

 return'<div class="scene coast">'+coastSVG(day,sfx)+'<div class="chip cl">바다</div><div class="chip cr">육지</div>'+(q.t==="name"?'<div class="arrow">'+(q.a==="해풍"?"→":"←")+'</div>':'')+'</div>'}
function scene(q,sfx){
 if(q.t==="map")return mapScene(q);
 if(q.t==="season")return seasonScene(q);
 if(q.t==="coast"||q.t==="name")return coastScene(q,sfx);
 if(q.t==="temp")return'<div class="scene"><div style="position:absolute;left:0;right:0;top:18px;text-align:center;font-weight:900;color:#58717e">두 공기의 온도를 비교해 보세요.</div><div class="side left"><span class="label">'+q.l+'</span></div><div class="side right"><span class="label">'+q.r+'</span></div></div>';
 if(q.t==="surface")return'<div class="scene"><div style="position:absolute;left:0;right:0;top:18px;text-align:center;font-weight:900;color:#58717e">모래와 물의 온도를 비교해 보세요.</div><div class="side left"><span class="label">'+q.l+'</span></div><div class="side right"><span class="label">'+q.r+'</span></div></div>';
 if(q.t==="hl")return'<div class="scene"><div style="position:absolute;left:0;right:0;top:18px;text-align:center;font-weight:900;color:#58717e">H = 고기압 · L = 저기압</div><div class="side left"><span class="label" style="font-size:42px">'+q.l+'</span></div><div class="side right"><span class="label" style="font-size:42px">'+q.r+'</span></div></div>';
 return'<div class="scene"><div class="side left"><span class="label">'+q.l+'</span></div><div class="side right"><span class="label">'+q.r+'</span></div></div>'}
function choices(q){
 if(q.t==="map")return[["↖","NW"],["↘","SE"]];
 if(q.t==="season")return[["남동풍","남동풍"],["북서풍","북서풍"]];
 if(q.t==="name")return[["해풍","해풍"],["육풍","육풍"]];
 return[["←","L"],["→","R"]]}
function addButtons(el,q,p){el.innerHTML="";el.className=p?"pbuttons":"answers";var c=choices(q);for(var k=0;k<c.length;k++){(function(pair){var b=document.createElement("button");b.className="ans"+(pair[0].length>2?" text":"");b.textContent=pair[0];b.onclick=function(){if(p)bPick(p-1,pair[1]);else pick(pair[1],0)};el.appendChild(b)})(c[k])}}

/* ===== 2인용: 각자 따로 진행 (같은 문제 순서, 각자 속도) ===== */
var P=[null,null],lastStormSfx=0;
function bnew(){return{idx:0,startT:0,raf:0,locked:true,lastSec:99,streak:0,done:false,storm:false,rand:false}}
function addScore(i,d){if(i===0)score1+=d;else score2+=d}
function panelHTML(p){return'<div class="player p'+p+'" id="pl'+p+'"><div class="pscorebox"><span class="pscore" id="pst'+p+'">'+(p===1?score1:score2)+'<small>점</small></span></div><div class="pname">'+esc(names[p-1])+'</div>'
 +'<div class="round"><span id="pr'+p+'"></span><span id="pf'+p+'" class="final hide"></span></div>'
 +'<div class="barrow"><div class="bar"><div id="pt'+p+'" class="timer"></div></div><span id="psec'+p+'" class="secs"></span></div>'
 +'<div id="pq'+p+'" class="q"></div><div id="psc'+p+'" class="psc"></div><div id="pb'+p+'"></div>'
 +'<div id="pfl'+p+'" class="flash"></div><div id="pin'+p+'" class="intro hide"></div></div>'}
function battleStart(){var b=$("#battle"),g=gameId;b.className="battle";b.innerHTML=panelHTML(1)+panelHTML(2);
 P=[bnew(),bnew()];shownScore=[score1,score2];bRender(0,g);bRender(1,g)}
function bLimit(s){return qInfo(s.idx).lim}
function bAlarm(i,on){var p=i+1;$("#pl"+p).classList.toggle("alarm",on);$("#pt"+p).classList.toggle("danger",on);$("#psec"+p).classList.toggle("danger",on)}
function bFlash(i,t,ok){var f=$("#pfl"+(i+1));f.textContent=t;f.style.background=ok?"#1f9d6bb3":"#d03a4bbb";f.classList.add("on");setTimeout(function(){f.classList.remove("on")},ok?650:800)}
function bShake(i){var e=$("#pl"+(i+1));e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake")}
function bRender(i,g){if(g!==gameId||P[i].done)return;var s=P[i],p=i+1;
 if(s.idx===BASE_N&&!s.rand){s.rand=true;bRand(i,g);return}
 if(s.idx===STORM_FROM&&!s.storm){s.storm=true;bStorm(i,g);return}
 var inf=qInfo(s.idx);s.locked=false;var q=inf.q,hard=inf.hard,fin=hard||inf.fin;
 bAlarm(i,false);s.lastSec=99;$("#pl"+p).classList.toggle("storm",s.idx>=STORM_FROM);
 $("#pr"+p).textContent="ROUND "+(s.idx+1)+(s.idx>=STORM_FROM?" 🌪️":"")+(s.idx>=BASE_N?" 🎲":"");
 var f=$("#pf"+p);f.classList.toggle("hide",!fin);f.textContent=hard?"HARD WIND":"FINAL WIND";
 $("#pq"+p).textContent=q.q;$("#psc"+p).innerHTML=scene(q,"p"+p);$("#psec"+p).textContent=bLimit(s).toFixed(1);
 addButtons($("#pb"+p),q,p);
 s.startT=performance.now();cancelAnimationFrame(s.raf);bTick(i,g)}
function bNext(i,g,ms){later(g,ms,function(){P[i].idx++;bRender(i,g)})}
function bTick(i,g){if(g!==gameId||P[i].done)return;var s=P[i],p=i+1,lim=bLimit(s),rem=Math.max(0,lim-(performance.now()-s.startT)/1000);
 $("#pt"+p).style.width=(rem/lim*100)+"%";$("#psec"+p).textContent=rem.toFixed(1);
 var danger=rem<=3;bAlarm(i,danger);
 if(danger&&rem>0){var sc=Math.ceil(rem);if(sc!==s.lastSec){s.lastSec=sc;sfxTick(sc)}}
 if(rem<=0){s.locked=true;bAlarm(i,false);s.streak=0;addScore(i,-50);update();sfxWrong();bShake(i);bFlash(i,"⏰ TIME OUT",false);bNext(i,g,850);return}
 s.raf=requestAnimationFrame(function(){bTick(i,g)})}
function bPick(i,v){var s=P[i];if(!s||s.locked||s.done||paused)return;s.locked=true;cancelAnimationFrame(s.raf);bAlarm(i,false);
 var ok=v===questions[s.idx].a,g=gameId;
 if(ok){s.streak++;addScore(i,calcPoints((performance.now()-s.startT)/1000,bLimit(s),questions[s.idx].t==="season",s.streak))}else{s.streak=0;addScore(i,-100)}
 update();if(ok)sfxOk();else{sfxWrong();bShake(i)}
 bFlash(i,ok?okMsg(s.streak):badMsg(),ok);
 bNext(i,g,ok?700:850)}
function bStorm(i,g){var s=P[i],el=$("#pin"+(i+1));s.locked=true;el.className="intro stormy";
 el.innerHTML='<div class="windlines">'+streaks(10)+'</div><div class="sbox"><div class="spin">🌪️</div><div class="sbig">지금부터<br>강풍이 불어온다!</div><div class="ssub">정신 바짝 차려요!</div></div>';
 var now=performance.now();if(now-lastStormSfx>1500){lastStormSfx=now;sfxStorm()}
 later(g,1300,function(){el.className="intro hide";el.innerHTML="";bRender(i,g)})}
/* ===== 연출 도우미 ===== */
function streaks(n){var h="";for(var i=0;i<n;i++)h+='<i style="top:'+Math.floor(Math.random()*96)+'%;width:'+(18+Math.floor(Math.random()*25))+'%;animation-delay:-'+(Math.random()*1.5).toFixed(2)+'s;animation-duration:'+(0.7+Math.random()*0.9).toFixed(2)+'s"></i>';return h}
$("#windlines").innerHTML=streaks(10);
function later(g,ms,fn){setTimeout(function chk(){if(g!==gameId)return;if(paused){setTimeout(chk,200);return}fn()},ms)}
function hideIntro(){var it=$("#intro");it.className="intro hide";it.innerHTML=""}
function countdown(done){var g=gameId,el=$("#intro"),n=3;locked=true;el.className="intro";
 (function step(){if(n>0){el.innerHTML='<div class="cd"><div>'+n+'</div></div>';sfxBeep(660,.15);n--;later(g,800,step)}
  else{el.innerHTML='<div class="cd go"><div>START!</div></div>';sfxBeep(1100,.3);whoosh();later(g,650,function(){hideIntro();done()})}})()}
function stormIntro(done){var g=gameId,el=$("#intro");locked=true;el.className="intro stormy";
 el.innerHTML='<div class="windlines">'+streaks(16)+'</div><div class="sbox"><div class="spin">🌪️</div><div class="sbig">지금부터<br>강풍이 불어온다!</div><div class="ssub">정신 바짝 차려요!</div></div>';
 sfxStorm();later(g,1300,function(){hideIntro();done()})}
function shake(){var p=$("#play");p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake")}
function endAlarm(){$("#main").classList.remove("alarm");$("#timer").classList.remove("danger");$("#secs").classList.remove("danger")}

/* ===== 제한 시간 / 랜덤 사이클 ===== */
function fmtClock(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2)}
function clockDraw(rem){var p=$("#progress");p.textContent="⏱ "+fmtClock(rem);p.classList.toggle("hot",rem<=10&&rem>0)}
function clockStop(){clearInterval(clockId);clockId=0;$("#progress").classList.remove("hot")}
function clockStart(){clockStop();endAt=performance.now()+GAME_SEC*1000;clockDraw(GAME_SEC);clockId=setInterval(clockTick,100)}
function clockTick(){if(paused)return;var rem=(endAt-performance.now())/1000;if(rem<=0){clockStop();clockDraw(0);timeUp();return}clockDraw(rem)}
/* 첫 사이클(정해진 순서)이 끝나면 전체 문제를 섞어서 계속 이어 붙임 — 2인용도 같은 순서 공유 */
function ensureQ(i){while(questions.length<=i)questions=questions.concat(shuffle(ALLQ))}
function qInfo(i){ensureQ(i);var q=questions[i],hard=q.t==="season",fin=i>=BASE_N-3&&i<BASE_N;return{q:q,hard:hard,fin:fin,lim:hard?12:(fin?6:8)}}
function randHTML(){return'<div class="sbox"><div class="spin">🎲</div><div class="sbig">이번엔<br>랜덤이다!</div><div class="ssub">문제 순서가 마구 섞여요</div></div>'}
function randIntro(done){var g=gameId,el=$("#intro");locked=true;el.className="intro rand";el.innerHTML=randHTML();whoosh();sfxBeep(880,.15);later(g,2300,function(){hideIntro();done()})}
function bRand(i,g){var s=P[i],el=$("#pin"+(i+1));s.locked=true;el.className="intro rand";el.innerHTML=randHTML();whoosh();sfxBeep(880,.15);
 later(g,2300,function(){el.className="intro hide";el.innerHTML="";bRender(i,g)})}
function timeUp(){cancelAnimationFrame(raf);endAlarm();locked=true;gameId++;var g=gameId,box='<div class="sbox"><div class="sbig">⏰ TIME UP!</div><div class="ssub">시간이 끝났어요</div></div>';
 if(mode==="battle"){for(var k=0;k<2;k++){var st=P[k];if(st){st.done=true;st.locked=true;cancelAnimationFrame(st.raf);bAlarm(k,false)}
   var e=$("#pin"+(k+1));if(e){e.className="intro timeup";e.innerHTML=box}}}
 else{var it=$("#intro");it.className="intro timeup";it.innerHTML=box}
 sfxBeep(880,.2);setTimeout(function(){sfxBeep(660,.45)},220);
 later(g,1700,function(){hideIntro();finish()})}

/* ===== 게임 진행 ===== */
function isHard(){return qInfo(idx).hard}
function limit(){return qInfo(idx).lim}
function render(){if(mode==="battle"){battleStart();return}
 if(idx===BASE_N&&!randShown){randShown=true;randIntro(render);return}
 if(idx===STORM_FROM&&!stormShown){stormShown=true;stormIntro(render);return}
 var inf=qInfo(idx);locked=false;var q=inf.q;endAlarm();lastSec=99;$("#main").classList.toggle("storm",idx>=STORM_FROM);
 $("#round").textContent="ROUND "+(idx+1)+(idx>=STORM_FROM?"  🌪️ 강풍 구간":"")+(idx>=BASE_N?"  🎲 랜덤":"");$("#final").classList.toggle("hide",!(inf.hard||inf.fin));
 $("#final").textContent=inf.hard?"HARD WIND · 12초 · 고득점":"FINAL WIND";
 $("#q").textContent=q.q;$("#scene").innerHTML=scene(q);$("#secs").textContent=limit().toFixed(1);
 $("#battle").classList.add("hide");$("#solo").classList.remove("hide");addButtons($("#solo"),q,0);
 startT=performance.now();cancelAnimationFrame(raf);tick()}
function next(g){if(g!==gameId)return;idx++;if(paused){pendingNext=true;return}render()}
function tick(){var rem=Math.max(0,limit()-(performance.now()-startT)/1000);$("#timer").style.width=(rem/limit()*100)+"%";$("#secs").textContent=rem.toFixed(1);
 var danger=rem<=3;$("#timer").classList.toggle("danger",danger);$("#secs").classList.toggle("danger",danger);$("#main").classList.toggle("alarm",danger);
 if(danger&&rem>0){var sc=Math.ceil(rem);if(sc!==lastSec){lastSec=sc;sfxTick(sc)}}
 if(rem<=0){locked=true;endAlarm();streak=[0,0,0];score1-=50;update();sfxWrong();shake();flash("⏰ TIME OUT",false);var g=gameId;setTimeout(function(){next(g)},850);return}raf=requestAnimationFrame(tick)}
function pick(v){if(locked||paused)return;locked=true;cancelAnimationFrame(raf);endAlarm();var ok=v===questions[idx].a;
 if(ok){streak[0]++;score1+=calcPoints((performance.now()-startT)/1000,limit(),isHard(),streak[0])}else{streak[0]=0;score1-=100}
 update();if(ok)sfxOk();else{sfxWrong();shake()}
 flash(ok?okMsg(streak[0]):badMsg(),ok);var g=gameId;setTimeout(function(){next(g)},ok?700:850)}
function calcPoints(e,lim,hard,n){var win=hard?6:4,f=Math.max(0,1-e/win),base=(hard?200:100)+150*f,mult=1+Math.min(Math.max(n,1)-1,9)*0.2;return Math.round(base*mult/10)*10}
function okMsg(n){return"⭕ 정답!"+(n>=2?"\n🔥 "+n+"콤보":"")}
function badMsg(){return"❌ 오답!"}
var shownScore=[null,null];
function update(){$("#s1").textContent=score1;$("#s2").textContent=score2;
 if(mode!=="battle")return;var v=[score1,score2];
 for(var k=0;k<2;k++){var e=$("#pst"+(k+1));if(!e)continue;e.firstChild.nodeValue=v[k];
  if(shownScore[k]!==null&&shownScore[k]!==v[k]){e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}shownScore[k]=v[k]}}
function flash(t,ok){var f=$("#flash");f.textContent=t;f.style.background=ok?"#1f9d6bb3":"#d03a4bbb";f.classList.add("on");setTimeout(function(){f.classList.remove("on")},ok?650:800)}

function startGame(){
 var koreanPressure=normal.filter(function(q){return q.t==="lr"});
 var hlPressure=normal.filter(function(q){return q.t==="hl"});
 var temperature=normal.filter(function(q){return q.t==="temp"||q.t==="surface"});
 var coast=normal.filter(function(q){return q.t==="coast"||q.t==="name"});
 var seasonal=normal.filter(function(q){return q.t==="season"});
 /* 고/저 → H/L → 온도 → 해풍·육풍 → 한반도 기압배치 → 계절풍 */
 questions=shuffle(koreanPressure).concat(shuffle(hlPressure),shuffle(temperature),shuffle(coast),shuffle(maps),shuffle(seasonal));
 BASE_N=questions.length;ALLQ=normal.concat(maps);randShown=false;
 idx=0;score1=score2=0;gameId++;P=[null,null];$("#play").classList.toggle("bmode",mode==="battle");paused=false;pendingNext=false;stormShown=false;streak=[0,0,0];update();
 $("#n1").textContent=names[0];$("#n2").textContent=names[1];
 $("#q").textContent="";$("#scene").innerHTML="";$("#solo").innerHTML="";$("#battle").innerHTML="";$("#timer").style.width="100%";$("#secs").textContent="";$("#round").textContent="READY";clockStop();clockDraw(GAME_SEC);$("#final").classList.add("hide");endAlarm();$("#main").classList.remove("storm");
 show("play");bgmStart();countdown(function(){clockStart();render()})}
function finish(){bgmStop();clockStop();cancelAnimationFrame(raf);var info="",w,fs;
 if(mode==="solo"){var r=record(names[0],score1,"solo");
  w="MISSION CLEAR!";fs=esc(names[0])+" · "+score1+"점";info=rankText(names[0],r)}
 else{var r1=record(names[0],score1,"battle"),r2=record(names[1],score2,"battle");
  w=score1===score2?"DRAW!":(score1>score2?names[0]:names[1])+" WIN!";
  fs=esc(names[0])+" "+score1+" : "+score2+" "+esc(names[1]);info=rankText(names[0],r1)+"<br>"+rankText(names[1],r2)}
 $("#winner").textContent=w;$("#finalScore").innerHTML=fs;$("#rankInfo").innerHTML=info;show("end");whoosh()}
function rankText(n,r){var k=rankOf(n),t=esc(n)+": "+k.rank+"위";
 if(r.prev===null)t+=" · 🌟 첫 기록 등록!";else if(r.isBest)t+=" · 🎉 내 최고 기록 경신!";return t}

/* ===== 버튼 연결 ===== */
var ms=document.querySelectorAll("[data-mode]");for(var z=0;z<ms.length;z++)ms[z].onclick=function(){showName(this.getAttribute("data-mode"))};
$("#rankBtn").onclick=function(){showRank()};
$("#again").onclick=function(){startGame()};
$("#endRank").onclick=function(){showRank(mode==="battle"?[names[0],names[1]]:[names[0]])};
$("#endHome").onclick=goHome;
$("#homeBtn").onclick=function(){
 if(screen!=="play"){goHome();return}
 paused=true;pauseAt=performance.now();cancelAnimationFrame(raf);if(mode==="battle"&&P[0])for(var pi=0;pi<2;pi++)cancelAnimationFrame(P[pi].raf);
 modal('<h3>🏠 홈으로 돌아갈까요?</h3><p>지금까지 푼 점수는 기록되지 않아요.</p><div><button class="mb gray" id="mc">계속하기</button><button class="mb red" id="mo">홈으로</button></div>');
 $("#mc").onclick=function(){closeModal();paused=false;endAt+=performance.now()-pauseAt;
  if(mode==="battle"){var dt=performance.now()-pauseAt,gg=gameId;for(var q2=0;q2<2;q2++){var st=P[q2];if(st&&!st.locked&&!st.done){st.startT+=dt;bTick(q2,gg)}}return}
  if(pendingNext){pendingNext=false;render();return}if(!locked){startT+=performance.now()-pauseAt;tick()}};
 $("#mo").onclick=function(){closeModal();goHome()}};

/* ===== 숨겨진 관리자 (점수 초기화) ===== */
$("#adminBtn").onclick=function(){
 modal('<h3>🔒 관리자</h3><p>비밀번호를 입력하세요</p><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><div class="mmsg" id="pinMsg"></div><div><button class="mb gray" id="mc">닫기</button><button class="mb" id="mo">확인</button></div>');
 var p=$("#pin");setTimeout(function(){p.focus()},60);
 function ok(){if(p.value===ADMIN_PIN)adminMenu();else{$("#pinMsg").textContent="비밀번호가 달라요";p.value="";p.focus()}}
 $("#mo").onclick=ok;$("#mc").onclick=closeModal;p.onkeydown=function(e){if(e.key==="Enter")ok()}};
function adminMenu(){var n=loadRecs().length;
 modal('<h3>⚙️ 관리자 메뉴</h3><p>저장된 기록: <b>'+n+'개</b></p><div><button class="mb red" id="ma">🗑 점수 전부 초기화</button></div><div><button class="mb gray" id="mc">닫기</button></div>');
 $("#mc").onclick=closeModal;
 $("#ma").onclick=function(){modal('<h3>정말 지울까요?</h3><p>1인용·2인용 순위와 기록이 모두 사라지고<br>되돌릴 수 없어요.</p><div><button class="mb gray" id="mc">취소</button><button class="mb red" id="mo">모두 지우기</button></div>');
  $("#mc").onclick=closeModal;
  $("#mo").onclick=function(){saveRecs([]);modal('<h3>✅ 초기화 완료</h3><p>모든 점수 기록을 지웠어요.</p><div><button class="mb" id="mc">확인</button></div>');$("#mc").onclick=closeModal}}}
})();
</script></body></html>
